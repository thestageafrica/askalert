name: Supabase keep-alive

# Hits a public health endpoint daily so the free Supabase project is less likely to pause.
# Prefer the web Pages health.json (always free). Optionally also ping Supabase REST.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping web health
        env:
          HEALTH_URL: ${{ secrets.KEEPALIVE_HEALTH_URL }}
        run: |
          set -euo pipefail
          URL="${HEALTH_URL:-https://askalert.pages.dev/health.json}"
          echo "GET $URL"
          curl -fsS "$URL" | tee /tmp/health.json
          grep -q '"ok"' /tmp/health.json

      - name: Optional Supabase REST ping
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Supabase secrets not set; skipping REST ping."
            exit 0
          fi
          curl -fsS \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/areas?select=id&limit=1" \
            -o /tmp/areas.json
          echo "Supabase REST ping ok"
