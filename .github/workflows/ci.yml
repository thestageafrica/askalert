name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.askalert.com
          # Non-placeholder digits for CI only — production uses the real Vercel env value.
          NEXT_PUBLIC_WHATSAPP_NUMBER: '2348012345678'
          ADMIN_BASIC_USER: admin
          ADMIN_BASIC_PASSWORD: ci-placeholder-password
        run: pnpm build
